<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Operations Video Wall</title>
<style>
  :root {
    --bg-dark: #07090e;
    --panel-bg: rgba(14, 20, 32, 0.94);
    --panel-card: #0f172a;
    --panel-border: #1e293b;
    --panel-border-hover: #334155;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --live-green: #10b981;
    --down-red: #ef4444;
    --amber-warn: #f59e0b;
    --drag-glow: rgba(59, 130, 246, 0.55);
    --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: var(--font);
    overflow: hidden;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* Header Bar */
  header {
    flex: 0 0 50px;
    background: var(--panel-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .live-pulse {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--live-green);
    box-shadow: 0 0 8px var(--live-green);
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(0.85); }
  }
  .brand-text {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-main);
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--panel-border);
    flex-shrink: 0;
  }

  /* Grid Mode Selector (1x1, 2x2 TV mode, 3x3, 4x4) */
  .grid-mode-nav {
    display: flex;
    align-items: center;
    background: rgba(15, 23, 42, 0.85);
    padding: 2px 4px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    gap: 3px;
    flex-shrink: 0;
  }
  .grid-mode-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 7px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .grid-mode-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.08);
  }
  .grid-mode-btn.active {
    background: var(--accent);
    color: #fff;
  }

  /* Slide Navigation */
  .slide-nav {
    display: flex;
    align-items: center;
    background: rgba(15, 23, 42, 0.85);
    padding: 3px 6px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    gap: 5px;
    flex-shrink: 0;
  }
  .slide-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .slide-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.08);
  }
  .slide-select {
    background: rgba(30, 41, 59, 0.9);
    color: var(--text-main);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
    font-family: inherit;
  }
  .slide-select:hover {
    border-color: var(--accent);
  }

  /* Auto Tour Controls */
  .tour-nav {
    display: flex;
    align-items: center;
    background: rgba(15, 23, 42, 0.85);
    padding: 2px 5px;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    gap: 4px;
    flex-shrink: 0;
  }
  .tour-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .tour-btn:hover {
    color: var(--text-main);
    background: rgba(255, 255, 255, 0.08);
  }
  .tour-btn.active {
    background: var(--live-green);
    color: #fff;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
  }

  .spacer { flex: 1; min-width: 8px; }

  /* Control Buttons */
  .btn-ctrl {
    background: rgba(30, 41, 59, 0.8);
    color: var(--text-main);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    outline: none;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .btn-ctrl:hover {
    border-color: var(--accent);
    background: rgba(51, 65, 85, 0.9);
  }
  .btn-ctrl:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-hover);
  }
  .btn-primary:hover {
    background: var(--accent-hover);
  }

  /* Health Stats & Clock */
  .stats-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .stat-badge {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stat-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .stat-dot.live { background: var(--live-green); box-shadow: 0 0 5px var(--live-green); }
  .stat-dot.down { background: var(--down-red); }
  .stat-val { color: var(--text-main); font-weight: 600; }

  #clock {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: #cbd5e1;
    background: rgba(0,0,0,0.45);
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }

  /* Viewport Main Area */
  #viewport {
    flex: 1 1 auto;
    position: relative;
    padding: 6px;
    overflow: hidden;
    background: #04060a;
  }

  /* Dynamic Camera Grid (1x1, 2x2, 3x3, 4x4) */
  #grid16Container {
    width: 100%;
    height: 100%;
    display: grid;
    gap: 6px;
  }
  #grid16Container.grid-16 {
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
  }
  #grid16Container.grid-9 {
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }
  #grid16Container.grid-4 {
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
  }
  #grid16Container.grid-1 {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
  }

  /* Video Tile */
  .tile {
    position: relative;
    background: #000;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    outline: none;
  }
  .tile:hover {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
  }
  .tile:focus, .tile.tv-focused {
    border-color: #38bdf8 !important;
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.7), 0 0 18px rgba(56, 189, 248, 0.5) !important;
    transform: scale(1.01);
    z-index: 10;
  }

  /* Dragging States */
  .tile.is-dragging {
    opacity: 0.4;
    cursor: grabbing;
    border: 2px dashed var(--accent) !important;
    transform: scale(0.97);
  }
  .tile.drag-over {
    border: 2px solid var(--accent-hover) !important;
    background: rgba(59, 130, 246, 0.18) !important;
    box-shadow: 0 0 18px var(--drag-glow) !important;
    transform: scale(1.02);
    z-index: 10;
  }

  .tile video-stream, .tile video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
    pointer-events: none;
  }

  /* Slot Badge (Grip Handle) */
  .tile-grip {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(15, 23, 42, 0.85);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    z-index: 4;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: grab;
    backdrop-filter: blur(4px);
    transition: all 0.15s ease;
  }
  .tile:hover .tile-grip, .tile:focus .tile-grip {
    color: var(--text-main);
    border-color: var(--accent);
    background: rgba(30, 41, 59, 0.95);
  }
  .tile-grip svg {
    width: 10px;
    height: 10px;
    fill: currentColor;
    opacity: 0.8;
  }

  /* Tile OSD Footer */
  .tile-osd {
    position: absolute;
    left: 0;
    bottom: 0;
    right: 0;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 500;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.45) 70%, transparent 100%);
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    z-index: 3;
  }
  .tile-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background-color 0.3s;
  }
  .tile-dot.live {
    background: var(--live-green);
    box-shadow: 0 0 6px var(--live-green);
  }
  .tile-dot.down {
    background: var(--down-red);
  }

  .tile-name {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  }
  .tile-group {
    font-size: 10px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.55);
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* Tile Action Buttons */
  .tile-btn-group {
    display: flex;
    align-items: center;
    gap: 4px;
    pointer-events: auto;
  }
  .tile-act-btn {
    opacity: 0;
    color: #cbd5e1;
    cursor: pointer;
    font-size: 12px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(255,255,255,0.15);
    transition: all 0.15s;
  }
  .tile:hover .tile-act-btn, .tile:focus .tile-act-btn, .tile.tv-focused .tile-act-btn { opacity: 1; }
  .tile-act-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-hover);
  }

  /* Modals */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.active { display: flex; }

  .settings-modal-window {
    background: #0b1120;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    width: 900px;
    max-width: 95vw;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 40px rgba(0,0,0,0.85);
    overflow: hidden;
  }
  .settings-header {
    flex: 0 0 54px;
    background: rgba(15, 23, 42, 0.95);
    padding: 0 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
  }
  .settings-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-search-bar {
    flex: 0 0 52px;
    background: rgba(15, 23, 42, 0.6);
    padding: 8px 18px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-input-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .search-icon {
    position: absolute;
    left: 10px;
    font-size: 13px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 7px 12px 7px 32px;
    background: #1e293b;
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .search-input:focus {
    border-color: var(--accent);
  }

  .settings-body {
    flex: 1 1 auto;
    padding: 16px 18px;
    overflow-y: auto;
    background: #090e1a;
  }
  .settings-footer {
    flex: 0 0 54px;
    background: rgba(15, 23, 42, 0.95);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--panel-border);
  }

  /* DVR Overview Grid */
  .dvr-overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .dvr-overview-card {
    background: var(--panel-card);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .dvr-overview-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
    background: #131d36;
  }
  .dvr-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dvr-card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-main);
  }
  .dvr-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(59, 130, 246, 0.15);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.3);
  }
  .dvr-card-info {
    font-size: 12px;
    color: var(--text-muted);
  }
  .dvr-card-preview {
    font-size: 11px;
    color: #64748b;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dvr-card-action {
    margin-top: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* DVR Detail View */
  .dvr-detail-view {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .dvr-detail-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--panel-border);
  }
  .dvr-detail-nav-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
  }
  .dvr-name-edit-wrap {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dvr-name-edit-wrap label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .dvr-name-edit-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
  }
  .dvr-name-edit-input:focus {
    border-color: var(--accent);
  }

  .dvr-channels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 10px;
  }
  .dvr-channel-card {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dvr-channel-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 42px;
  }
  .dvr-channel-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 12px;
    outline: none;
  }
  .dvr-channel-input:focus {
    border-color: var(--accent);
  }

  /* Quick Assign Modal */
  .quick-assign-window {
    background: #0b1120;
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    width: 650px;
    max-width: 95vw;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 40px rgba(0,0,0,0.85);
    overflow: hidden;
  }
  .picker-header {
    flex: 0 0 54px;
    background: rgba(15, 23, 42, 0.95);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--panel-border);
  }
  .picker-title {
    font-size: 15px;
    font-weight: 700;
  }
  .picker-edit-name-bar {
    padding: 12px 18px;
    background: rgba(15, 23, 42, 0.4);
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .picker-edit-name-bar label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .picker-name-input {
    flex: 1;
    background: #1e293b;
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  .picker-name-input:focus {
    border-color: var(--accent);
  }

  .picker-body {
    flex: 1 1 auto;
    padding: 14px 18px;
    overflow-y: auto;
    background: #090e1a;
  }
  .picker-group-section {
    margin-bottom: 16px;
  }
  .picker-group-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #60a5fa;
    margin-bottom: 8px;
  }
  .picker-pills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 6px;
  }
  .picker-pill {
    background: #0f172a;
    border: 1px solid var(--panel-border);
    color: var(--text-main);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s ease;
  }
  .picker-pill:hover {
    border-color: var(--accent);
    background: #1e293b;
  }
  .picker-pill.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-hover);
    font-weight: 700;
  }

  .picker-footer {
    flex: 0 0 54px;
    background: rgba(15, 23, 42, 0.95);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--panel-border);
  }

  /* Solo HD View Modal */
  .solo-modal {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 200;
    display: none;
    flex-direction: column;
  }
  .solo-modal.active { display: flex; }
  .solo-header {
    height: 48px;
    background: rgba(14, 20, 32, 0.9);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    z-index: 210;
  }
  .solo-title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .solo-stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .solo-stage video-stream, .solo-stage video {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Toast Notification */
  #toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid var(--accent);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    pointer-events: none;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s ease;
    z-index: 300;
  }
  #toast.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<div id="app">
  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <span class="live-pulse"></span>
      <span class="brand-text">CCTV Wall</span>
    </div>

    <div class="divider"></div>

    <!-- Grid Size Selector -->
    <div class="grid-mode-nav">
      <button class="grid-mode-btn" data-grid="1" title="1 Cam Spotlight (Key: 1)">1×1</button>
      <button class="grid-mode-btn" data-grid="4" title="4 Cameras (Key: 2)">2×2</button>
      <button class="grid-mode-btn" data-grid="9" title="9 Cameras (Key: 3)">3×3</button>
      <button class="grid-mode-btn active" data-grid="16" title="16 Cameras (Key: 4)">4×4</button>
    </div>

    <div class="divider"></div>

    <!-- Slide Navigation -->
    <div class="slide-nav">
      <button class="slide-btn" id="btnSlidePrev" title="Previous Page (Left Arrow)">◀</button>
      <select class="slide-select" id="slideSelect" title="Select Camera Group"></select>
      <button class="slide-btn" id="btnSlideNext" title="Next Page (Right Arrow)">▶</button>
    </div>

    <!-- Auto-Tour Carousel for TV -->
    <div class="tour-nav">
      <button class="tour-btn" id="btnTourToggle" title="Auto-Rotate Camera Slides (Key: T or Space)">
        <span>▶</span> <span>Auto Tour</span>
      </button>
      <select class="slide-select" id="tourIntervalSelect" title="Tour Rotation Interval">
        <option value="10">10s</option>
        <option value="15" selected>15s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </div>

    <div class="spacer"></div>

    <!-- Stream Mode Engine Selector -->
    <select class="slide-select" id="streamModeSelect" title="Streaming Protocol / TV Mode">
      <option value="auto">Auto (Smart Engine)</option>
      <option value="mjpeg">⚡ TV Mode: Live MJPEG (Zero Decoder Lag)</option>
      <option value="snapshot">📺 TV Mode: Snapshots (Ultra Low RAM)</option>
      <option value="mse">Live Video (MSE)</option>
      <option value="webrtc">Live Video (WebRTC)</option>
    </select>

    <!-- Settings Button -->
    <button class="btn-ctrl btn-primary" id="btnOpenSettings" title="Configure DVR and Camera Names">
      ⚙ Settings
    </button>

    <!-- Layout Reset -->
    <button class="btn-ctrl" id="btnResetLayout" title="Reset current slide layout to default order">
      ↺ Reset
    </button>

    <div class="divider"></div>

    <!-- Health Stats & Clock -->
    <div class="stats-wrap">
      <div class="stat-badge">
        <span class="stat-dot live"></span>
        <span>Live:</span>
        <span class="stat-val" id="statLive">0</span>
      </div>
      <div class="stat-badge">
        <span class="stat-dot down"></span>
        <span>Down:</span>
        <span class="stat-val" id="statDown">0</span>
      </div>
      <div class="stat-badge">
        <span>Total:</span>
        <span class="stat-val" id="statTotal">112</span>
      </div>
    </div>

    <div class="divider"></div>
    <div id="clock">00:00:00</div>
    <button class="btn-ctrl" id="btnFullscreen" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
  </header>

  <!-- Camera Viewport Grid -->
  <main id="viewport">
    <div id="grid16Container" class="grid-16"></div>
  </main>
</div>

<!-- ==========================================================================
     SETTINGS MODAL (Level 1: DVR List -> Level 2: DVR Channels)
     ========================================================================== -->
<div class="modal-backdrop" id="settingsModalBackdrop">
  <div class="settings-modal-window">
    <div class="settings-header">
      <div class="settings-title">
        <span id="settingsHeaderTitle">⚙ DVR & Camera Settings</span>
      </div>
      <div class="spacer"></div>
      <button class="btn-ctrl" id="btnCloseSettings" style="padding:2px 8px;">✕</button>
    </div>

    <div class="settings-search-bar">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="settingsSearchInput" class="search-input" placeholder="Search DVR alias, camera name, or channel ID...">
      </div>
    </div>

    <div class="settings-body" id="settingsContainer"></div>

    <div class="settings-footer">
      <div style="display:flex; gap:8px;">
        <button class="btn-ctrl" id="btnExportJson" title="Export all settings & layouts as JSON file">📥 Export JSON</button>
        <button class="btn-ctrl" id="btnImportJson" title="Import settings from JSON file">📤 Import JSON</button>
        <input type="file" id="fileImportJson" accept=".json" style="display:none;">
        <button class="btn-ctrl" id="btnResetNames" style="color:var(--down-red);" title="Reset custom names to default">↺ Reset Names</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-ctrl" id="btnCancelSettings">Cancel</button>
        <button class="btn-ctrl btn-primary" id="btnSaveSettings">💾 Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================================================
     QUICK TILE ASSIGN & SEARCHABLE CAMERA PICKER MODAL
     ========================================================================== -->
<div class="modal-backdrop" id="quickAssignBackdrop">
  <div class="quick-assign-window">
    <div class="picker-header">
      <div class="picker-title" id="quickAssignTitle">Assign Camera to Slot #1</div>
      <button class="btn-ctrl" id="btnQuickAssignClose" style="padding:2px 8px;">✕</button>
    </div>

    <div class="picker-edit-name-bar">
      <label>CAMERA NAME / ALIAS:</label>
      <input type="text" id="pickerNameInput" class="picker-name-input" placeholder="e.g. Main Gate, Loading Dock">
    </div>

    <div class="settings-search-bar" style="background:none;">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="pickerSearchInput" class="search-input" placeholder="Filter cameras by name or DVR...">
      </div>
    </div>

    <div class="picker-body" id="pickerContainer"></div>

    <div class="picker-footer">
      <button class="btn-ctrl" id="btnQuickAssignEmpty" style="color:var(--text-muted);">Set as Empty Slot</button>
      <div style="display:flex; gap:8px;">
        <button class="btn-ctrl" id="btnQuickAssignCancel">Cancel</button>
        <button class="btn-ctrl btn-primary" id="btnQuickAssignSave">Apply Assignment</button>
      </div>
    </div>
  </div>
</div>

<!-- ==========================================================================
     SOLO HD VIEW MODAL
     ========================================================================== -->
<div class="solo-modal" id="soloModal">
  <div class="solo-header">
    <button class="btn-ctrl" id="soloBack" style="font-weight:700;">← Back to Grid (Esc / Return)</button>
    <div class="solo-title" id="soloTitle">Camera Solo HD</div>
    <div class="spacer"></div>
    <button class="btn-ctrl" id="soloPrevCam" title="Previous Camera (Left Arrow)">◀ Prev</button>
    <button class="btn-ctrl" id="soloNextCam" title="Next Camera (Right Arrow)">Next ▶</button>
    <button class="btn-ctrl" id="soloFs">⛶ Fullscreen</button>
  </div>
  <div class="solo-stage" id="soloStage"></div>
</div>

<!-- Toast Notification -->
<div id="toast"></div>

<script src="cameras.js"></script>
<script>
(function() {
  // 1. Dynamic go2rtc host resolution
  var params = new URLSearchParams(window.location.search);
  var host = (window.location && window.location.hostname) ? window.location.hostname : '127.0.0.1';
  var proto = (window.location && window.location.protocol === 'https:') ? 'https:' : 'http:';
  var defaultGo2rtc = proto + '//' + host + ':1984';
  var GO2RTC = (params.get('server') || window.GO2RTC || defaultGo2rtc).replace(/\/$/, '');
  var CAMERAS = window.CAMERAS || [];
  var WS_URL = GO2RTC.replace(/^http/, 'ws') + '/api/ws?src=';

  // Smart TV Detection & Default Grid Sizing
  var isSmartTV = (function() {
    var ua = (navigator && navigator.userAgent) ? navigator.userAgent.toLowerCase() : '';
    return ua.indexOf('smart-tv') !== -1 ||
           ua.indexOf('smarttv') !== -1 ||
           ua.indexOf('tizen') !== -1 ||
           ua.indexOf('webos') !== -1 ||
           ua.indexOf('netcast') !== -1 ||
           ua.indexOf('viera') !== -1 ||
           ua.indexOf('bravia') !== -1 ||
           ua.indexOf('googletv') !== -1 ||
           ua.indexOf('android tv') !== -1 ||
           ua.indexOf('crkey') !== -1 ||
           ua.indexOf('aft') !== -1 ||
           ua.indexOf('hbbtv') !== -1 ||
           ua.indexOf('roku') !== -1 ||
           (params.get('tv') === '1');
  })();

  // Initial Grid Size: Default to 16 (4x4), or from URL param (?grid=4), or saved config
  var initialGridParam = parseInt(params.get('grid') || params.get('mode'), 10);
  var currentGridSize = (initialGridParam && [1, 4, 9, 16].indexOf(initialGridParam) !== -1)
      ? initialGridParam
      : 16;

  // Streaming Mode selection
  var currentStreamMode = params.get('stream') || 'auto';

  // Camera lookup index
  var camMap = {};
  CAMERAS.forEach(function(c) { camMap[c.name] = c; });

  // Extract unique DVR groups in order
  var dvrGroups = [];
  var dvrMap = {};
  CAMERAS.forEach(function(c) {
    var grp = c.group || 'Default';
    if (!dvrMap[grp]) {
      dvrMap[grp] = { group: grp, cams: [] };
      dvrGroups.push(dvrMap[grp]);
    }
    dvrMap[grp].cams.push(c);
  });

  // 2. Persistent Storage (Layouts, Custom Camera Names, DVR Aliases)
  var STORAGE_KEY = 'video_wall_layout_v3';
  var currentSlideIdx = 0;
  var totalSlides = Math.max(1, Math.ceil(CAMERAS.length / currentGridSize));

  function getDefaultSlideCams(slideIndex, gridSize) {
    var size = gridSize || currentGridSize;
    var start = slideIndex * size;
    var slice = CAMERAS.slice(start, start + size).map(function(c) { return c.name; });
    while (slice.length < size && CAMERAS.length > 0) {
      slice.push('');
    }
    return slice;
  }

  function loadLayoutConfig() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && typeof parsed === 'object') {
          return parsed;
        }
      }
    } catch (e) {
      console.warn('Failed to load layout config:', e);
    }
    return { slides: {}, customNames: {}, dvrAliases: {}, gridSize: currentGridSize };
  }

  var layoutConfig = loadLayoutConfig();
  if (!layoutConfig.slides) layoutConfig.slides = {};
  if (!layoutConfig.customNames) layoutConfig.customNames = {};
  if (!layoutConfig.dvrAliases) layoutConfig.dvrAliases = {};
  if (layoutConfig.gridSize && [1, 4, 9, 16].indexOf(layoutConfig.gridSize) !== -1 && !params.get('grid')) {
    currentGridSize = layoutConfig.gridSize;
  }

  function saveLayoutConfig() {
    try {
      layoutConfig.gridSize = currentGridSize;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(layoutConfig));
    } catch (e) {
      console.error('Failed to save layout config:', e);
    }
  }

  function getCurrentSlideCams() {
    var key = currentGridSize + '_' + currentSlideIdx;
    if (!layoutConfig.slides[key] || !Array.isArray(layoutConfig.slides[key]) || layoutConfig.slides[key].length !== currentGridSize) {
      layoutConfig.slides[key] = getDefaultSlideCams(currentSlideIdx, currentGridSize);
    }
    return layoutConfig.slides[key];
  }

  function getCameraLabel(camId) {
    if (!camId) return 'Empty Slot';
    if (layoutConfig.customNames && layoutConfig.customNames[camId]) {
      return layoutConfig.customNames[camId];
    }
    var cam = camMap[camId];
    return cam ? (cam.label || cam.name) : camId;
  }

  function getCameraGroup(camId) {
    if (!camId) return '';
    var cam = camMap[camId];
    var originalGroup = cam ? (cam.group || '') : '';
    if (layoutConfig.dvrAliases && layoutConfig.dvrAliases[originalGroup]) {
      return layoutConfig.dvrAliases[originalGroup];
    }
    return originalGroup;
  }

  function getDvrTitle(originalGroup) {
    if (layoutConfig.dvrAliases && layoutConfig.dvrAliases[originalGroup]) {
      return layoutConfig.dvrAliases[originalGroup];
    }
    return originalGroup;
  }

  // Active streaming elements tracker
  var activeStreams = [];
  var soloActiveStream = null;
  var soloCurrentCam = null;

  // Load go2rtc webcomponent
  var sc = document.createElement('script');
  sc.src = 'webcomponent.js';
  sc.onload = initApp;
  sc.onerror = function() {
    console.error('Failed to load webcomponent.js');
    initApp();
  };
  document.head.appendChild(sc);

  function getStreamModes() {
    if (currentStreamMode === 'mjpeg') return 'mjpeg';
    if (currentStreamMode === 'snapshot') return 'snapshot';
    if (currentStreamMode === 'mse') return 'mse,mp4,mjpeg';
    if (currentStreamMode === 'webrtc') return 'webrtc,mse,mjpeg';
    return isSmartTV ? 'mjpeg' : 'mse,webrtc,mp4,mjpeg';
  }

  function makeStream(srcName, mode) {
    var effectiveMode = mode || getStreamModes();
    var el = document.createElement('video-stream');
    el.mode = effectiveMode;
    el.background = true;
    el._wsSrc = WS_URL + encodeURIComponent(srcName);
    return el;
  }
  function startStream(el) {
    if (el && el._wsSrc) el.src = el._wsSrc;
  }
  function stopStream(el) {
    if (el) {
      if (typeof el.ondisconnect === 'function') {
        try { el.ondisconnect(); } catch (e) {}
      }
      el.src = '';
    }
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 2400);
  }

  // 3. Application Initialization
  function initApp() {
    var statTotal = document.getElementById('statTotal');
    if (statTotal) statTotal.textContent = CAMERAS.length;

    updateGridModeUI();
    updateSlideSelectOptions();
    setupEvents();
    renderGrid();

    // Start status polling and clock
    setInterval(pollHealth, 3000);
    setInterval(function() {
      var clock = document.getElementById('clock');
      if (clock) clock.textContent = new Date().toLocaleTimeString();
    }, 1000);

    // Check for auto-tour in URL (?tour=15)
    if (params.get('tour')) {
      var intervalSec = parseInt(params.get('tour'), 10) || 15;
      var intervalSelect = document.getElementById('tourIntervalSelect');
      if (intervalSelect) intervalSelect.value = intervalSec;
      startTour();
    }
  }

  function updateGridModeUI() {
    document.querySelectorAll('.grid-mode-btn').forEach(function(btn) {
      var g = parseInt(btn.dataset.grid, 10);
      btn.classList.toggle('active', g === currentGridSize);
    });
    var container = document.getElementById('grid16Container');
    if (container) {
      container.className = 'grid-' + currentGridSize;
    }
  }

  function updateSlideSelectOptions() {
    totalSlides = Math.max(1, Math.ceil(CAMERAS.length / currentGridSize));
    if (currentSlideIdx >= totalSlides) currentSlideIdx = 0;

    var slideSelect = document.getElementById('slideSelect');
    if (!slideSelect) return;
    slideSelect.innerHTML = '';
    for (var i = 0; i < totalSlides; i++) {
      var opt = document.createElement('option');
      opt.value = i;
      var startCam = i * currentGridSize + 1;
      var endCam = Math.min((i + 1) * currentGridSize, CAMERAS.length);
      opt.textContent = 'Slide ' + (i + 1) + ' (' + startCam + '–' + endCam + ')';
      slideSelect.appendChild(opt);
    }
    slideSelect.value = currentSlideIdx;
  }

  // 4. Render Dynamic Camera Grid
  var draggedSlotIdx = null;
  var isDraggingTile = false;
  var lastDragEndTime = 0;
  var focusedTileIdx = 0;

  function renderGrid() {
    activeStreams.forEach(function(t) { stopStream(t.el); });
    activeStreams = [];

    var container = document.getElementById('grid16Container');
    if (!container) return;
    container.innerHTML = '';
    container.className = 'grid-' + currentGridSize;

    var slideCams = getCurrentSlideCams();

    for (var slotIdx = 0; slotIdx < currentGridSize; slotIdx++) {
      var camId = slideCams[slotIdx] || '';
      var cam = camMap[camId] || (camId ? { name: camId, solo: camId, tile: camId + '_sub' } : null);

      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.setAttribute('draggable', 'true');
      tile.setAttribute('tabindex', '0');
      tile.dataset.slotIdx = slotIdx;
      tile.style.order = slotIdx;

      // Slot Grip Badge
      var grip = document.createElement('div');
      grip.className = 'tile-grip';
      grip.title = 'Slot #' + (slotIdx + 1) + ' (Drag to swap position)';
      grip.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 3h2v2H9V3zm4 0h2v2h-2V3zM9 7h2v2H9V7zm4 0h2v2h-2V7zM9 11h2v2H9v-2zm4 0h2v2h-2v-2zM9 15h2v2H9v-2zm4 0h2v2h-2v-2zM9 19h2v2H9v-2zm4 0h2v2h-2v-2z"/></svg><span>#' + (slotIdx + 1) + '</span>';
      tile.appendChild(grip);

      var streamEl = null;
      var dotEl = null;

      if (cam) {
        var streamSrc = cam.tile || (cam.name + '_sub');
        streamEl = makeStream(streamSrc);
        tile.appendChild(streamEl);

        var osd = document.createElement('div');
        osd.className = 'tile-osd';
        var labelText = getCameraLabel(cam.name);
        var groupText = getCameraGroup(cam.name);

        osd.innerHTML = '<span class="tile-dot"></span>' +
          '<span class="tile-name" title="' + escapeHtml(labelText) + '">' + escapeHtml(labelText) + '</span>' +
          '<span class="tile-group" title="' + escapeHtml(groupText) + '">' + escapeHtml(groupText) + '</span>' +
          '<div class="tile-btn-group">' +
            '<button class="tile-act-btn btn-assign" draggable="false" title="Assign / Rename">⚙</button>' +
            '<button class="tile-act-btn btn-expand" draggable="false" title="Solo HD View (or double-click tile)">⤢</button>' +
          '</div>';
        tile.appendChild(osd);

        dotEl = osd.querySelector('.tile-dot');
        var btnAssign = osd.querySelector('.btn-assign');
        var btnExpand = osd.querySelector('.btn-expand');

        (function(cRef, sIdx) {
          btnAssign.addEventListener('mousedown', function(e) { e.stopPropagation(); });
          btnAssign.addEventListener('click', function(e) {
            e.stopPropagation();
            openQuickAssign(sIdx);
          });

          btnExpand.addEventListener('mousedown', function(e) { e.stopPropagation(); });
          btnExpand.addEventListener('click', function(e) {
            e.stopPropagation();
            openSolo(cRef);
          });
        })(cam, slotIdx);

        startStream(streamEl);
        activeStreams.push({ cam: cam, el: streamEl, dot: dotEl, tile: tile });
      } else {
        var emptyOsd = document.createElement('div');
        emptyOsd.className = 'tile-osd';
        emptyOsd.innerHTML = '<span class="tile-name" style="color:var(--text-muted); font-style:italic;">Empty Slot</span>' +
          '<div class="tile-btn-group">' +
            '<button class="tile-act-btn btn-assign" draggable="false" style="opacity:1;" title="Assign Camera">⚙ Assign</button>' +
          '</div>';
        tile.appendChild(emptyOsd);
        var btnEmptyAssign = emptyOsd.querySelector('.btn-assign');
        (function(sIdx) {
          btnEmptyAssign.addEventListener('mousedown', function(e) { e.stopPropagation(); });
          btnEmptyAssign.addEventListener('click', function(e) {
            e.stopPropagation();
            openQuickAssign(sIdx);
          });
        })(slotIdx);
      }

      // Drag & Click Events
      (function(tRef, cRef, sIdx) {
        tRef.addEventListener('dragstart', function(e) {
          isDraggingTile = true;
          draggedSlotIdx = sIdx;
          tRef.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', sIdx); } catch(ex) {}
        });

        tRef.addEventListener('dragend', function() {
          tRef.classList.remove('is-dragging');
          document.querySelectorAll('.tile').forEach(function(el) {
            el.classList.remove('drag-over');
          });
          draggedSlotIdx = null;
          isDraggingTile = false;
          lastDragEndTime = Date.now();
        });

        tRef.addEventListener('dragover', function(e) {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (draggedSlotIdx !== null && draggedSlotIdx !== sIdx) {
            tRef.classList.add('drag-over');
          }
        });

        tRef.addEventListener('dragleave', function() {
          tRef.classList.remove('drag-over');
        });

        tRef.addEventListener('drop', function(e) {
          e.preventDefault();
          e.stopPropagation();
          tRef.classList.remove('drag-over');
          if (draggedSlotIdx !== null && draggedSlotIdx !== sIdx) {
            swapSlots(draggedSlotIdx, sIdx);
          }
        });

        // Click / Double Click / Remote Focus
        tRef.addEventListener('focus', function() {
          focusedTileIdx = sIdx;
        });

        tRef.addEventListener('click', function(e) {
          if (Date.now() - lastDragEndTime < 300) return;
          if (e.target.closest('.tile-btn-group') || e.target.closest('.tile-act-btn')) return;
          if (cRef) {
            openSolo(cRef);
          } else {
            openQuickAssign(sIdx);
          }
        });

        tRef.addEventListener('dblclick', function(e) {
          if (Date.now() - lastDragEndTime < 300) return;
          if (cRef) openSolo(cRef);
        });
      })(tile, cam, slotIdx);

      container.appendChild(tile);
    }
  }

  // 5. Swap Slots
  function swapSlots(idxA, idxB) {
    var slideCams = getCurrentSlideCams();
    var temp = slideCams[idxA];
    slideCams[idxA] = slideCams[idxB];
    slideCams[idxB] = temp;

    var key = currentGridSize + '_' + currentSlideIdx;
    layoutConfig.slides[key] = slideCams;
    saveLayoutConfig();

    var tileA = document.querySelector('.tile[data-slot-idx="' + idxA + '"]');
    var tileB = document.querySelector('.tile[data-slot-idx="' + idxB + '"]');

    if (tileA && tileB) {
      tileA.dataset.slotIdx = idxB;
      tileA.style.order = idxB;
      var gripA = tileA.querySelector('.tile-grip span');
      if (gripA) gripA.textContent = '#' + (idxB + 1);

      tileB.dataset.slotIdx = idxA;
      tileB.style.order = idxA;
      var gripB = tileB.querySelector('.tile-grip span');
      if (gripB) gripB.textContent = '#' + (idxA + 1);

      showToast('Swapped Slot #' + (idxA + 1) + ' ⇄ Slot #' + (idxB + 1));
    } else {
      renderGrid();
    }
  }

  // 6. Quick Assign Modal
  var quickAssignBackdrop = document.getElementById('quickAssignBackdrop');
  var quickAssignTitle = document.getElementById('quickAssignTitle');
  var pickerNameInput = document.getElementById('pickerNameInput');
  var pickerSearchInput = document.getElementById('pickerSearchInput');
  var pickerContainer = document.getElementById('pickerContainer');
  var currentAssignSlot = null;
  var pickerSelectedCamId = '';

  function openQuickAssign(slotIdx) {
    currentAssignSlot = slotIdx;
    var slideCams = getCurrentSlideCams();
    pickerSelectedCamId = slideCams[slotIdx] || '';
    quickAssignTitle.textContent = 'Assign Camera to Slot #' + (slotIdx + 1);
    pickerNameInput.value = pickerSelectedCamId ? getCameraLabel(pickerSelectedCamId) : '';
    pickerSearchInput.value = '';

  function updateSingleTile(slotIdx) {
    var tile = document.querySelector('.tile[data-slot-idx="' + slotIdx + '"]');
    if (!tile) { renderGrid(); return; }

    var slideCams = getCurrentSlideCams();
    var camId = slideCams[slotIdx] || '';
    var cam = camMap[camId] || (camId ? { name: camId, solo: camId, tile: camId + '_sub' } : null);

    var existingIdx = -1;
    for (var i = 0; i < activeStreams.length; i++) {
      if (activeStreams[i].tile === tile) { existingIdx = i; break; }
    }
    if (existingIdx !== -1) {
      stopStream(activeStreams[existingIdx].el);
      activeStreams.splice(existingIdx, 1);
    }

    var oldStream = tile.querySelector('video-stream');
    if (oldStream) oldStream.remove();
    var oldOsd = tile.querySelector('.tile-osd');
    if (oldOsd) oldOsd.remove();

    if (cam) {
      var streamSrc = cam.tile || (cam.name + '_sub');
      var streamEl = makeStream(streamSrc);
      tile.appendChild(streamEl);

      var osd = document.createElement('div');
      osd.className = 'tile-osd';
      var labelText = getCameraLabel(cam.name);
      var groupText = getCameraGroup(cam.name);

      osd.innerHTML = '<span class="tile-dot"></span>' +
        '<span class="tile-name" title="' + escapeHtml(labelText) + '">' + escapeHtml(labelText) + '</span>' +
        '<span class="tile-group" title="' + escapeHtml(groupText) + '">' + escapeHtml(groupText) + '</span>' +
        '<div class="tile-btn-group">' +
          '<button class="tile-act-btn btn-assign" draggable="false" title="Assign / Rename">⚙</button>' +
          '<button class="tile-act-btn btn-expand" draggable="false" title="Solo HD View">⤢</button>' +
        '</div>';
      tile.appendChild(osd);

      var dotEl = osd.querySelector('.tile-dot');
      var btnAssign = osd.querySelector('.btn-assign');
      var btnExpand = osd.querySelector('.btn-expand');

      btnAssign.addEventListener('mousedown', function(e) { e.stopPropagation(); });
      btnAssign.addEventListener('click', function(e) {
        e.stopPropagation();
        openQuickAssign(parseInt(tile.dataset.slotIdx, 10));
      });

      btnExpand.addEventListener('mousedown', function(e) { e.stopPropagation(); });
      btnExpand.addEventListener('click', function(e) {
        e.stopPropagation();
        openSolo(cam);
      });

      startStream(streamEl);
      activeStreams.push({ cam: cam, el: streamEl, dot: dotEl, tile: tile });
    } else {
      var emptyOsd = document.createElement('div');
      emptyOsd.className = 'tile-osd';
      emptyOsd.innerHTML = '<span class="tile-name" style="color:var(--text-muted); font-style:italic;">Empty Slot</span>' +
        '<div class="tile-btn-group">' +
          '<button class="tile-act-btn btn-assign" draggable="false" style="opacity:1;" title="Assign Camera">⚙ Assign</button>' +
        '</div>';
      tile.appendChild(emptyOsd);
      var btnEmptyAssign = emptyOsd.querySelector('.btn-assign');
      btnEmptyAssign.addEventListener('mousedown', function(e) { e.stopPropagation(); });
      btnEmptyAssign.addEventListener('click', function(e) {
        e.stopPropagation();
        openQuickAssign(parseInt(tile.dataset.slotIdx, 10));
      });
    }
  }

  function applyQuickAssign() {
    if (currentAssignSlot === null) return;
    var selectedCamId = pickerSelectedCamId || '';
    var customName = pickerNameInput.value.trim();

    var slideCams = getCurrentSlideCams();
    slideCams[currentAssignSlot] = selectedCamId;
    var key = currentGridSize + '_' + currentSlideIdx;
    layoutConfig.slides[key] = slideCams;

  function syncCurrentDvrInputsInMemory() {
    var aliasInput = document.getElementById('activeDvrAliasInput');
    if (aliasInput) {
      var orig = aliasInput.dataset.origGroup;
      var alias = aliasInput.value.trim();
      if (orig) {
        if (!layoutConfig.dvrAliases) layoutConfig.dvrAliases = {};
        if (alias && alias !== orig) {
          layoutConfig.dvrAliases[orig] = alias;
        } else {
          delete layoutConfig.dvrAliases[orig];
        }
      }
    }

    if (!layoutConfig.customNames) layoutConfig.customNames = {};
    document.querySelectorAll('.dvr-channel-input').forEach(function(input) {
      var camId = input.dataset.camId;
      var val = input.value.trim();
      if (camId) {
        var origCam = camMap[camId];
        var origLabel = origCam ? origCam.label || camId : camId;
        if (val && val !== origLabel) {
          layoutConfig.customNames[camId] = val;
        } else {
          delete layoutConfig.customNames[camId];
        }
      }
    });
  }

        var grpEl = tile.querySelector('.tile-group');

        var groupText = getCameraGroup(camId);

      try {
        var imported = JSON.parse(event.target.result);
        if (imported && typeof imported === 'object') {
          layoutConfig = imported;
          if (!layoutConfig.slides) layoutConfig.slides = {};
          if (!layoutConfig.customNames) layoutConfig.customNames = {};
          if (!layoutConfig.dvrAliases) layoutConfig.dvrAliases = {};

  function soloPrev() {

    var idx = CAMERAS.indexOf(soloCurrentCam);

  function startTour() {
    isTourRunning = true;

      clearTimeout(tourTimer);
      tourTimer = null;

    var btn = document.getElementById('btnTourToggle');
    if (btn) {
      btn.classList.remove('active');
      btn.innerHTML = '<span>▶</span> <span>Auto Tour</span>';

    showToast('Auto-Tour paused');

  function toggleTour() {
    if (isTourRunning) stopTour();
    else startTour();
  }

  function scheduleTourNext() {
    if (!isTourRunning) return;
    var intervalSec = parseInt(document.getElementById('tourIntervalSelect').value, 10) || 15;
    if (tourTimer) clearTimeout(tourTimer);
    tourTimer = setTimeout(function() {
      if (!isTourRunning) return;
      // Do not rotate if modal or solo is open
      if (!soloModal.classList.contains('active') &&
          !settingsModalBackdrop.classList.contains('active') &&
          !quickAssignBackdrop.classList.contains('active')) {
        currentSlideIdx = (currentSlideIdx + 1) % totalSlides;
        var slideSelect = document.getElementById('slideSelect');
        if (slideSelect) slideSelect.value = currentSlideIdx;
        renderGrid();
      }
      scheduleTourNext();
    }, intervalSec * 1000);
  }

  document.getElementById('tourIntervalSelect').addEventListener('change', function() {
    if (isTourRunning) scheduleTourNext();

  // 10. Health Status Polling
  function pollHealth() {
    fetch(GO2RTC + '/api/streams', { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) throw new Error('Status error');
        return res.json();
      })
      .then(function(data) {
        var liveCount = 0;
        var downCount = 0;

        activeStreams.forEach(function(item) {
          var streamKey = item.cam.tile || (item.cam.name + '_sub');
          var st = data[streamKey];
          var isLive = !!(st && st.producers && st.producers.length > 0);

          if (item.dot) {
            item.dot.classList.toggle('live', isLive);
            item.dot.classList.toggle('down', !isLive);
          }

          if (isLive) liveCount++;
          else downCount++;
        });

        var statLive = document.getElementById('statLive');
        var statDown = document.getElementById('statDown');
        if (statLive) statLive.textContent = liveCount;
        if (statDown) statDown.textContent = downCount;
      })
      .catch(function() {
        var statLive = document.getElementById('statLive');
        var statDown = document.getElementById('statDown');
        if (statLive) statLive.textContent = '0';
        if (statDown) statDown.textContent = activeStreams.length;
        activeStreams.forEach(function(item) {
          if (item.dot) {
            item.dot.classList.remove('live');
            item.dot.classList.add('down');
          }
        });
      });
  }

  // 11. Cross-Browser Fullscreen Helper
  function toggleFullscreen(targetEl) {
    var el = targetEl || document.documentElement;
    var isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

    if (!isFs) {
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (typeof req === 'function') {
        req.call(el);
      }
    } else {
      var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
      if (typeof exit === 'function') {
        exit.call(document);
      }
    }
  }

  // 12. Event Listeners Setup
  function setupEvents() {
    // Grid Mode Buttons
    document.querySelectorAll('.grid-mode-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var g = parseInt(btn.dataset.grid, 10);
        if (g && [1, 4, 9, 16].indexOf(g) !== -1) {
          currentGridSize = g;
          saveLayoutConfig();
          updateGridModeUI();
          updateSlideSelectOptions();
          renderGrid();
          showToast('Grid Mode: ' + g + ' Camera' + (g > 1 ? 's' : ''));
        }
      });
    });

    // Stream Mode Selector
    var streamSelect = document.getElementById('streamModeSelect');
    if (streamSelect) {
      streamSelect.value = currentStreamMode;
      streamSelect.addEventListener('change', function(e) {
        currentStreamMode = e.target.value;
        renderGrid();
        showToast('Stream mode: ' + currentStreamMode.toUpperCase());
      });
    }

    // Slide Navigation
    var slideSelect = document.getElementById('slideSelect');
    slideSelect.addEventListener('change', function(e) {
      currentSlideIdx = parseInt(e.target.value, 10) || 0;
      renderGrid();
    });

    document.getElementById('btnSlidePrev').addEventListener('click', function() {
      currentSlideIdx = (currentSlideIdx - 1 + totalSlides) % totalSlides;
      slideSelect.value = currentSlideIdx;
      renderGrid();
    });

    document.getElementById('btnSlideNext').addEventListener('click', function() {
      currentSlideIdx = (currentSlideIdx + 1) % totalSlides;
      slideSelect.value = currentSlideIdx;
      renderGrid();
    });

    // Reset Layout
    document.getElementById('btnResetLayout').addEventListener('click', function() {
      if (confirm('Reset Slide ' + (currentSlideIdx + 1) + ' layout to default order?')) {
        var key = currentGridSize + '_' + currentSlideIdx;
        layoutConfig.slides[key] = getDefaultSlideCams(currentSlideIdx, currentGridSize);
        saveLayoutConfig();
        renderGrid();
        showToast('Layout reset to default');
      }
    });

    // Settings Modal Events
    document.getElementById('btnOpenSettings').addEventListener('click', openSettingsModal);
    document.getElementById('btnCloseSettings').addEventListener('click', closeSettingsModal);
    document.getElementById('btnCancelSettings').addEventListener('click', closeSettingsModal);
    document.getElementById('btnSaveSettings').addEventListener('click', saveSettingsChanges);

    // Quick Assign Modal Events
    document.getElementById('btnQuickAssignClose').addEventListener('click', closeQuickAssign);
    document.getElementById('btnQuickAssignCancel').addEventListener('click', closeQuickAssign);
    document.getElementById('btnQuickAssignSave').addEventListener('click', applyQuickAssign);

    // Solo Modal Events
    document.getElementById('soloBack').addEventListener('click', closeSolo);
    document.getElementById('soloFs').addEventListener('click', function() {
      toggleFullscreen(soloModal);
    });

    // Fullscreen Toggle
    document.getElementById('btnFullscreen').addEventListener('click', function() {
      toggleFullscreen(document.documentElement);
    });

    // Smart TV Remote & Keyboard Navigation
    document.addEventListener('keydown', function(e) {
      var isModalOpen = soloModal.classList.contains('active') ||
                        quickAssignBackdrop.classList.contains('active') ||
                        settingsModalBackdrop.classList.contains('active');

      if (e.key === 'Escape' || e.key === 'Back' || e.keyCode === 10009 || e.keyCode === 27) {
        if (soloModal.classList.contains('active')) closeSolo();
        else if (quickAssignBackdrop.classList.contains('active')) closeQuickAssign();
        else if (settingsModalBackdrop.classList.contains('active')) {
          if (selectedDvrIndex !== null) {
            syncCurrentDvrInputsInMemory();
            selectedDvrIndex = null;
            settingsSearchInput.value = '';
            renderSettingsView();
          } else {
            closeSettingsModal();
          }
        }
      } else if (soloModal.classList.contains('active')) {
        if (e.key === 'ArrowRight' || e.keyCode === 39) soloNext();
        else if (e.key === 'ArrowLeft' || e.keyCode === 37) soloPrev();
      } else if (!isModalOpen) {
        if (e.key === 'ArrowRight' || e.keyCode === 39) {
          document.getElementById('btnSlideNext').click();
        } else if (e.key === 'ArrowLeft' || e.keyCode === 37) {
          document.getElementById('btnSlidePrev').click();
        } else if (e.key === '1') {
          var b1 = document.querySelector('.grid-mode-btn[data-grid="1"]');
          if (b1) b1.click();
        } else if (e.key === '2') {
          var b2 = document.querySelector('.grid-mode-btn[data-grid="4"]');
          if (b2) b2.click();
        } else if (e.key === '3') {
          var b3 = document.querySelector('.grid-mode-btn[data-grid="9"]');
          if (b3) b3.click();
        } else if (e.key === '4') {
          var b4 = document.querySelector('.grid-mode-btn[data-grid="16"]');
          if (b4) b4.click();
        } else if (e.key === 't' || e.key === 'T' || e.key === ' ') {
          toggleTour();
        } else if (e.key === 'f' || e.key === 'F') {
          toggleFullscreen(document.documentElement);
        } else if (e.key === 'Enter' || e.keyCode === 13) {
          var tiles = document.querySelectorAll('.tile');
          if (tiles[focusedTileIdx]) {
            tiles[focusedTileIdx].click();
          }
        }
      }
    });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m];
    });
  }
})();
</script>
</body>
</html>
