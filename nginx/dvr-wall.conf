# ==============================================================================
# Nginx Reverse Proxy Configuration for DVR Video Wall
# ==============================================================================
# Place this file in /etc/nginx/sites-available/dvr-wall
# Enable with: sudo ln -s /etc/nginx/sites-available/dvr-wall /etc/nginx/sites-enabled/
# Test with:   sudo nginx -t && sudo systemctl reload nginx

upstream dvr_web {
    server 127.0.0.1:8085;
    keepalive 32;
}

upstream go2rtc_api {
    server 127.0.0.1:1984;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name dvr.local your-server-domain.com;

    # Maximum upload size for configs/firmware
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static Web App & Video Wall Interface
    location / {
        proxy_pass http://dvr_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # go2rtc API & WebSocket Signaling
    location /api/ {
        proxy_pass http://go2rtc_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
